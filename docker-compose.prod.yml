version: '3.8'

# Production overrides for docker-compose.yml
# Use: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set in production
    ports:
      - "127.0.0.1:5432:5432"  # Only expose to localhost
    volumes:
      - /var/lib/wpp_disp/postgres:/var/lib/postgresql/data  # Persistent storage
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DEBUG: "False"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"  # Only expose to localhost (nginx will proxy)
    volumes: []  # Don't mount source code in production
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}  # Your production API URL
    ports:
      - "127.0.0.1:3001:80"  # Only expose to localhost (nginx will proxy)
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy (production only)
  nginx:
    image: nginx:alpine
    container_name: wpp_disp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available:/etc/nginx/sites-available:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - wpp_disp_network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
